version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: ticket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticket_system
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: ticket-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql-data: